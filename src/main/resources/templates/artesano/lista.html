<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='lista de productooos')">
</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->
    <div id="page-wrapper">
        <div class="header">
            <h1 class="page-header">
                Descripcion de Productos
            </h1>
        </div>

        <!-- /. COMUNIDAD  -->
        <div id="page-inner">
            <!-- /. COMUNIDAD  -->
            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-action">
                            ARTESANO
                            <a class="btn btn-primary right" th:href="@{'/artesano/nuevo'}">agregar</a>
                        </div>
                        <div class="card-content">
                            <div class="table-responsive">
                                <div th:if="${msgAr != null}" th:text="${msgAr}" class="alert alert-success"
                                     role="alert"></div>

                                <table class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>NOMBRE</th>
                                        <th>APELLIDO PATERNO</th>
                                        <th>APELLIDO MATERNO</th>
                                        <th>CODIGO</th>
                                        <th>COMUNIDAD</th>
                                        <th></th>
                                        <th></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="a, info : ${listaArtesano}">
                                        <td th:text="${info.index +1}">1</td>
                                        <td th:text="${a.nombreartesano}">Home</td>
                                        <td th:text="${a.apellidopaterno}">H</td>
                                        <td th:text="${a.apellidomaterno}">H</td>
                                        <td th:text="${a.codigoartesano}">H</td>
                                        <td th:text="${a.comunidad_idcomunidad.nombrecomunidad}">H</td>
                                        <td><a th:href="@{'artesano/editar?id=' + ${a.idartesano}}"> editar</a></td>
                                        <td><a th:href="@{'artesano/borrar?id=' + ${a.idartesano}}">borrar</a></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <!-- End  Kitchen Sink -->
                </div>
            </div>
        </div>

    </div>
</div>
<!-- /. PAGE WRAPPER  -->
<!-- /. WRAPPER  -->
<!-- JS Scripts-->

<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>

</body>

</html>
