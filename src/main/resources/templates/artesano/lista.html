<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='Lista de Artesanos')">
</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->
    <div id="page-wrapper">
        <div class="header">
            <h1 class="page-header">
                Artesano
            </h1>
        </div>


        <div id="page-inner">

            <div>

                <form method="get" th:action="@{'/artesano/buscador'}">

                    <input th:if="${busqueda!=null}" th:value="${busqueda}" name="searchField"
                           class="form-control mb-3" type="text" placeholder="Buscar"
                           aria-label="Search" style="width: 40%">
                    <input th:if="${busqueda==null}" name="searchField" class="form-control mb-3" type="text"
                           placeholder="Buscar"
                           aria-label="Search" style="width: 40%">
                    <div th:if="${msgBuscador != null}" th:text="${msgBuscador}" style="color: #ac2925"></div>

                    <button type="submit" class="btn btn-outline-danger">buscar</button>
                    <a th:href="@{'/artesano'}" class="btn btn-outline-danger">Limpiar</a>

                </form>

                <div th:if="${msgAr != null}" th:text="${msgAr}" class="alert alert-success"
                     role="alert"></div>
                <div th:if="${msgArt != null}" th:text="${msgArt}" class="alert alert-warning"
                     role="alert"></div>
            </div>

            <br>
            <div class="row">
                <div class="col-md-10">
                    <div class="card">

                        <div class="card-action" sec:authorize="hasAnyAuthority('Gestor principal')">

                            <a class="btn btn-outline-danger"th:href="@{'/artesano/nuevo'}">agregar</a>
                            <br>
                            <br>
                            <div th:text="'Total de artesanos: ' + ${totalItems} "></div>
                        </div>
                        <div class="card-content">
                            <div class="table-responsive">
                                <div th:if="${msgPagina != null}" th:text="${msgPagina}" class="alert alert-success"
                                     role="alert"></div>

                                <table class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr class="info">
                                        <th>#</th>
                                        <th>NOMBRE</th>
                                        <th>APELLIDO PATERNO</th>
                                        <th>APELLIDO MATERNO</th>
                                        <th>CODIGO</th>
                                        <th>COMUNIDAD</th>
                                        <th sec:authorize="hasAnyAuthority('Gestor principal')"></th>
                                        <th sec:authorize="hasAnyAuthority('Gestor principal')"></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="a, info : ${listaArtesano}">
                                        <td th:text="${info.index +1 +prev*10}">1</td>
                                        <td th:text="${a.nombreartesano}">Home</td>
                                        <td th:text="${a.apellidopaterno}">H</td>
                                        <td th:text="${a.apellidomaterno}">H</td>
                                        <td th:text="${a.codigoartesano}">H</td>
                                        <td th:text="${a.comunidad.getNombrecomunidad()}">H</td>
                                        <td sec:authorize="hasAnyAuthority('Gestor principal')" ><a th:href="@{'artesano/editar?id=' + ${a.idartesano}}"> editar</a></td>
                                        <td sec:authorize="hasAnyAuthority('Gestor principal')" ><a th:href="@{'artesano/borrar?id=' + ${a.idartesano}}">borrar</a></td>
                                    </tr>
                                    </tbody>
                                </table>

                                <br>




                                <div class="row">
                                    <div class="col-md-4"></div>
                                    <div class="col-md-8">

                                        <ul th:if="${last != 1}" class="pagination justify-content-center">

                                            <li  class ="page-item" th:if="${current != 1 }">
                                                <a class="page-link" th:if="${busqueda!=null}" th:href="@{'/artesano/buscador' + '?searchField=' + ${busqueda} +'&page=' + ${prev}} "> Anterior </a>
                                                <a class="page-link" th:unless="${busqueda!=null}" th:href="@{'/artesano' + '?page=' + ${prev}} "> Anterior </a>

                                            <li class ="page-item" th:each="page:${pages}" th:classappend="${current == page ? 'active' : ''}">
                                                <a class="page-link" th:if="${busqueda!=null}" th:href="@{'/artesano/buscador' + '?searchField=' + ${busqueda}+ '&page=' + ${page}} " th:text="${page}"></a>
                                            <a class="page-link" th:unless="${busqueda!=null}" th:href="@{'/artesano' + '?page=' + ${page}} " th:text="${page}"></a>

                                            </li>

                                            <li  class ="page-item" th:if="${current != last }">
                                                <a class="page-link" th:if="${busqueda!=null}" th:href="@{'/artesano/buscador' + '?searchField=' + ${busqueda}+ '&page=' + ${next}} "> Siguiente </a>
                                                <a class="page-link" th:unless="${busqueda!=null}" th:href="@{'/artesano' + '?page=' + ${next}} "> siguiente </a>


                                        </ul>

                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                    <!-- End  Kitchen Sink -->
                </div>
            </div>
        </div>

    </div>
</div>
<!-- /. PAGE WRAPPER  -->
<!-- /. WRAPPER  -->
<!-- JS Scripts-->

<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>

</body>

</html>
