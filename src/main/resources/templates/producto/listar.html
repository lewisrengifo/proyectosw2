<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='Lista de productos')">
</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->
    <div id="page-wrapper">
        <div class="header">
            <h1 class="page-header">
                Lista de Productos
            </h1>
        </div>

        <!-- /. COMUNIDAD  -->
        <div id="page-inner">
            <!-- /. COMUNIDAD  -->
            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-action">
                            <a class="btn btn-primary right" th:href="@{'/producto/nuevo'}">agregar</a>
                        </div>
                        <div class="card-content">
                            <div class="table-responsive">
                                <div th:if="${msgAr != null}" th:text="${msgAr}" class="alert alert-success"
                                     role="alert"></div>

                                <table class="table table-striped table-bordered table-hover">

                                    <tr class="info">
                                        <th>#</th>
                                        <th class="center">Nombre Producto</th>
                                        <th class="center">Código Producto</th>
                                        <th class="center">Descripción Producto</th>
                                        <th class="center">Código Desc. Producto</th>
                                        <th class="center">Línea</th>
                                        <th class="center">Foto</th>
                                    </tr>


                                    <tr th:each="producto, info : ${listaProductos}">
                                        <td th:text="${info.index + 1}"></td>
                                        <td th:text="${producto.getNombreproducto()}"></td>
                                        <td th:text="${producto.getCodigoproducto()}"></td>
                                        <td th:text="${producto.getDescripcionproducto()}"></td>
                                        <td th:text="${producto.getCodigodescripcionproducto()}"></td>
                                        <td th:text="${producto.getLinea()}"></td>
                                        <th class="center"><a href="" class="btn btn-warning" style='width:125px; height:33px'>Ver</a></th>
                                        <td><a class="btn btn-primary" th:href="@{'/producto/editar' + '?id=' + ${producto.getIdproducto()}}">Editar</a>
                                        </td>
                                        <td><a class="btn btn-danger" th:href="@{'producto/borrar' + '?id=' + ${producto.getIdproducto()}}">Borrar</a>
                                        </td>
                                    </tr>


                                </table>
                            </div>
                        </div>
                    </div>
                    <!-- End  Kitchen Sink -->
                </div>
            </div>
        </div>

    </div>
</div>
<!-- /. PAGE WRAPPER  -->
<!-- /. WRAPPER  -->
<!-- JS Scripts-->

<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>

</body>

</html>
