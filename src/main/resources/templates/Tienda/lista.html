<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='Gestion de Tiendas')">
</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->
    <div id="page-wrapper">

        <!-- /. CATEGORIA  -->
        <div id="page-inner">
            <!-- /. CATEGORIA  -->
            <div class="row">
                <div class="col-md-10">
                    <div class="card">
                        <div class="card-action">
                            Gestion de Tiendas
                        </div>
                        <div class="card-action">
                            <a class="btn btn-outline-danger" th:href="@{'/tienda/nuevo'}">agregar</a>
                        </div>

                        <div class="card-action" th:if="${last !=0}">
                            <a class="btn btn-outline-danger right"
                               th:href="@{'/inventarioTienda/asignarStock'}">Enviar Stock</a>
                        </div>
                        <div class="card-content">
                            <div class="table-responsive">
                                <div th:if="${msgPagina != null}" th:text="${msgPagina}" class="alert alert-warning"
                                     role="alert"></div>
                                <div th:if="${msg != null}" th:text="${msg}" class="alert alert-success"
                                     role="alert"></div>
                                <div th:if="${msg2 != null}" th:text="${msg2}" class="alert alert-danger"
                                     role="alert"></div>

                                <div th:if="${last ==0}">En este momento no hay tiendas en esta sede </div>


                                <table class="table table-striped table-bordered table-hover" th:if="${last>0}">
                                    <thead>
                                    <tr class="info" >
                                        <th>#</th>
                                        <th>NOMBRE</th>
                                        <th>Sede</th>
                                        <th></th>
                                        <th></th>
                                        <th></th>

                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="c, info : ${lista}">
                                        <td th:text="${info.index +1 + prev*5}">1</td>
                                        <td th:text="${c.nombre}">Home</td>
                                        <td th:text="${c.sede.nombre}">Home</td>
                                        <td><a th:href="@{'tienda/editar?id=' + ${c.idtienda}}"> editar</a></td>
                                        <td><a th:href="@{'tienda/borrar?id=' + ${c.idtienda}}">borrar</a></td>
                                        <td><a class="btn btn-outline-danger right"
                                               th:href="@{'/venta/registroventa?id=' + ${c.idtienda}}" > Compra </a></td>
                                    </tr>
                                    </tbody>
                                </table>
                                <div class="row" th:if="${last>0}">
                                    <div class="col-md-4"></div>
                                    <div class="col-md-8">

                                        <ul th:if="${last != 1}" class="pagination justify-content-center">
                                            <li class ="page-item" th:if="${current != 1 }">
                                                <a class="page-link"  th:if="${busqueda }" th:href="@{'/tienda/search' + '?page=' + ${prev} + '&' + 'search='+ ${busqueda}} "> Anterior </a>
                                                <a class="page-link" th:unless="${busqueda}" th:href="@{'/tienda' + '?page=' + ${prev}} "> Anterior </a>
                                            </li>

                                            <li class ="page-item" th:each="page:${pages}" th:classappend="${current == page ? 'active' : ''}" >
                                                <a class="page-link" th:if="${busqueda}" th:href="@{'/tienda/search' + '?search='+ ${busqueda} + '&' + 'page=' + ${page}} " th:text="${page}"  ></a>
                                                <a class="page-link" th:unless="${busqueda}" th:href="@{'/tienda' + '?page=' + ${page}} " th:text="${page}"  ></a>
                                            </li>

                                            <li class ="page-item" th:if="${current != last }">
                                                <a class="page-link"  th:if="${busqueda}" th:href="@{'/tienda/search' + '?page=' + ${next} + '&' + 'search='+ ${busqueda}} "> Siguiente </a>
                                                <a class="page-link" th:unless="${busqueda}" th:href="@{'/tienda' + '?page=' + ${next}} "> Siguiente </a>
                                            </li>

                                        </ul>


                                    </div>
                                </div>


                            </div>
                        </div>
                    </div>
                    <!-- End  Kitchen Sink -->
                </div>
            </div>
        </div>
    </div>
</div>
<!-- /. PAGE WRAPPER  -->
<!-- /. WRAPPER  -->
<!-- JS Scripts-->

<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>

</body>

</html>
