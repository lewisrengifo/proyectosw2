<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='Tamaños')">
</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->
    <div id="page-wrapper">
        <div class="header">
            <h1 class="page-header">
                Tamaños
            </h1>
        </div>
        <!-- /. CATEGORIA  -->
        <div id="page-inner">
            <!-- /. CATEGORIA  -->
            <div class="row">
                <div class="col-md-10 padding">
                    <div class="card">
                        <div class="card-content">
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr class="info">
                                        <th class="center">#</th>
                                        <th class="center">NOMBRE</th>
                                        <th class="center">CÓDIGO</th>
                                        <!--<th></th>
                                        <th></th>-->
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="c, info : ${lista}">
                                        <td class="center" th:text="${info.index +1}">1</td>
                                        <td class="center" th:text="${c.nombretamano}">Home</td>
                                        <td class="center" th:text="${c.codigotamano}">Home</td>
                                        <!--<td><a th:href="@{'tamano/editar?id=' + ${c.idtamano}}"> editar</a></td>
                                        <td><a th:href="@{'tamano/borrar?id=' + ${c.idtamano}}">borrar</a></td>-->
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <!-- End  Kitchen Sink -->
                </div>
            </div>
        </div>
    </div>
</div>
<!-- /. PAGE WRAPPER  -->
<!-- /. WRAPPER  -->
<!-- JS Scripts-->

<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>

</body>

</html>
