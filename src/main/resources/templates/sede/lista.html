<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/leftbar.html :: cabecera(titulo='Gestion de Sedes')">
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>
    <div id="page-wrapper">

        <h2 class="page-header">Gestion de Sedes</h2>
        <div id="page-inner">

            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-action">

                            <a class="btn btn-outline-danger mt-4 mb-4" th:href="@{'/sede/nuevo'}">Nueva Sede</a>

                            <div th:text="|Total de Usuario con Sedes : ${totalItems}|"></div>
                        </div>
                        <div class="card-action">
                            <a class="btn btn-outline-danger right"
                               th:href="@{'/inventarioSede/asignarStock'}">Enviar Stock</a>
                        </div>
                        <div class="card-content">
                            <div class="table-responsive">
                                <div th:if="${msg != null and msgsede == null}" th:text="${msg}"
                                     class="alert alert-success"
                                     role="alert"></div>
                                <div th:if="${msgsede != null}" th:text="${msgsede}" class="alert alert-danger"
                                     role="alert"></div>
                                <div th:if="${msgsdni != null}" th:text="${msgdni}" class="alert alert-danger"
                                     role="alert"></div>
                                <div th:if="${msgcorreo != null}" th:text="${msgcorreo}" class="alert alert-danger"
                                     role="alert"></div>
                                <div th:if="${msgPagina != null}" th:text="${msgPagina}" class="alert alert-danger"
                                     role="alert"></div>


                                <table class="table table-striped table-bordered table-hover">
                                    <tr class="info">
                                        <th>#</th>
                                        <th>Nombre de la sede</th>
                                        <th>Gestor acargo de la sede</th>
                                        <th></th>
                                        <th></th>


                                    </tr>
                                    <tr th:each="sede, info : ${listSedes}">
                                        <td th:text="${info.index + 1}"></td>
                                        <td th:text="${sede.sede_idsede.nombre}"></td>
                                        <td th:text="${sede.nombre}+ ' ' + ${sede.apellido}"></td>
                                        <td><a
                                               th:href="@{'/sede/editar' + '?id=' + ${sede.sede_idsede.idsede}}">Editar</a>
                                        </td>
                                        <td><a class="btn btn-outline-danger"
                                               th:href="@{'/sede/agregargestorAdicional' + '?id=' + ${sede.sede_idsede.idsede}}">Asignar un gestor adicional</a>
                                        </td>


                                    </tr>
                                </table>
                                <div class="row">
                                    <div class="col-md-2"></div>
                                    <div class="col-md-8">

                                        <br>

                                        <ul th:if="${last != 1}" class="pagination justify-content-center">

                                            <li class="page-item" th:classappend="${prev == 0 ? 'disabled': '' }">
                                                <a th:if="${searchField==null}" class="page-link"
                                                   th:href="@{'/sede' + '?page=' + ${prev}} ">
                                                    Anterior </a>
                                                <a th:if="${searchField!=null}" class="page-link"
                                                   th:href="@{'/usuario/buscador' + '?searchField=' +${searchField}+ '&page==' + ${prev}} ">
                                                    Anterior </a>

                                            <li class="page-item" th:each="page:${page}"
                                                th:classappend="${current == page ? 'active' : ''}">
                                                <a th:if="${searchField==null}" class="page-link"
                                                   th:href="@{'/sede' + '?page=' + ${page}} "
                                                   th:text="${page}"></a>
                                                <a th:if="${searchField!=null}" class="page-link"
                                                   th:href="@{'/sede/buscador' + '?searchField=' +${searchField}+ '&page=' + ${page}} "
                                                   th:text="${page}"></a>
                                            </li>

                                            <li class="page-item" th:classappend="${current == last ? 'disabled': '' }">
                                                <a th:if="${searchField==null}" class="page-link"
                                                   th:href="@{'/sede' + '?page=' + ${next}} ">
                                                    Siguiente </a>
                                                <a th:if="${searchField!=null}" class="page-link"
                                                   th:href="@{'/sede/buscador' + '?searchField=' +${searchField}+ '&page=' + ${next}} ">
                                                    Siguiente </a>

                                        </ul>

                                    </div>
                                    <div class="col-md-2"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>
</body>
</html>
