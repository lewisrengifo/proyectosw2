<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/leftbar.html :: cabecera(titulo='Lista de Sedes')">
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>
    <div id="page-wrapper">

        <h2 class="page-header">Lista de Sedes</h2>
        <div id="page-inner">
            <!--
            <div>
                <form method="get" th:action="@{'/sede/buscador'}">

                    <input th:if="${searchField!=null}" th:value="${searchField}" name="searchField"
                           class="form-control mb-3" type="text" placeholder="Buscar"
                           aria-label="Search" style="width: 40%">
                    <input th:if="${searchField==null}" name="searchField" class="form-control mb-3" type="text"
                           placeholder="Buscar"
                           aria-label="Search" style="width: 40%">
                    <div th:if="${msgBuscador != null}" th:text="${msgBuscador}" style="color: #ac2925"></div>
                    <button type="submit" class="btn btn-outline-danger">buscar</button>
                    <a th:href="@{'/sede/lista'}" class="btn btn-outline-danger">Limpiar</a>

                </form>
                <br>
            </div> -->
            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-action">

                            <a class="btn btn-outline-danger mt-4 mb-4" th:href="@{'/sede/nuevo'}">Nueva Sede</a>

                            <div th:text="|Total de sedes : ${totalItems}|"></div>
                        </div>
                        <div class="card-action">
                            <a class="btn btn-outline-danger right"
                               th:href="@{'/inventarioSede/asignarStock'}">Enviar Stock</a>
                        </div>
                        <div class="card-content">
                            <div class="table-responsive">
                                <div th:if="${msg != null and msgsede == null}" th:text="${msg}"
                                     class="alert alert-success"
                                     role="alert"></div>
                                <div th:if="${msgsede != null}" th:text="${msgsede}" class="alert alert-danger"
                                     role="alert"></div>
                                <div th:if="${msgsdni != null}" th:text="${msgdni}" class="alert alert-danger"
                                     role="alert"></div>
                                <div th:if="${msgcorreo != null}" th:text="${msgcorreo}" class="alert alert-danger"
                                     role="alert"></div>
                                <div th:if="${msgPagina != null}" th:text="${msgPagina}" class="alert alert-warning"
                                     role="alert"></div>


                                <table class="table table-striped table-bordered table-hover">
                                    <tr class="info">
                                        <th>#</th>
                                        <th>Nombre de la sede</th>
                                        <th>Gestor acargo de la sede</th>
                                        <th></th>
                                        <th></th>


                                    </tr>
                                    <tr th:each="sede, info : ${listSedes}">
                                        <td th:text="${info.index + 1}"></td>
                                        <td th:text="${sede.sede_idsede.nombre}"></td>
                                        <td th:text="${sede.nombre}+ ' ' + ${sede.apellido}"></td>
                                        <td><a class="btn btn-outline-danger"
                                               th:href="@{'/sede/editar' + '?id=' + ${sede.sede_idsede.idsede}}">Editar</a>
                                        </td>
                                        <td><a class="btn btn-outline-danger"
                                               th:href="@{'/sede/agregargestorAdicional' + '?id=' + ${sede.sede_idsede.idsede}}">Asignar un gestor adicional</a>
                                        </td>


                                    </tr>
                                </table>



                                <div class="row">
                                    <div class="col-md-4"></div>
                                    <div class="col-md-8">

                                        <ul th:if="${last != 1}" class="pagination justify-content-center">
                                            <li class ="page-item" th:if="${current != 1 }">
                                                <a class="page-link"  th:if="${searchField }" th:href="@{'/sede/buscador' + '?page=' + ${prev} + '&' + 'searchField='+ ${searchField}} "> Anterior </a>
                                                <a class="page-link" th:unless="${searchField}" th:href="@{'/sede' + '?page=' + ${prev}} "> Anterior </a>
                                            </li>

                                            <li class ="page-item" th:each="page:${pages}" th:classappend="${current == page ? 'active' : ''}" >
                                                <a class="page-link" th:if="${searchField}" th:href="@{'/sede/buscador' + '?searchField='+ ${searchField} + '&' + 'page=' + ${page}} " th:text="${page}"  ></a>
                                                <a class="page-link" th:unless="${searchField}" th:href="@{'/sede' + '?page=' + ${page}} " th:text="${page}"  ></a>
                                            </li>

                                            <li class ="page-item" th:if="${current != last }">
                                                <a class="page-link"  th:if="${searchField}" th:href="@{'/sede/searbuscadorch' + '?page=' + ${next} + '&' + 'searchField='+ ${searchField}} "> Siguiente </a>
                                                <a class="page-link" th:unless="${searchField}" th:href="@{'/sede' + '?page=' + ${next}} "> Siguiente </a>
                                            </li>

                                        </ul>


                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>
</body>
</html>
