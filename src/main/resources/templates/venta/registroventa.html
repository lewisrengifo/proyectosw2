<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='Venta')">
</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->
    <div id="page-wrapper">
        <div class="header">
            <h1 class="page-header">
                Registro de venta
            </h1>
        </div>

        <!-- /.   -->
        <div id="page-inner">

            <div class="row">
                <div class="col-md-12">
                    <div class="card">

                        <div class="card-content">
                            <div class="table-responsive">


                                <h2 >Complete los campos</h2>
                                <br>

                                <div th:if="${msg2 != null}" th:text="${msg2}" class="alert alert-success"
                                     role="alert"></div>
                                <div th:if="${msg1 != null}" th:text="${msg1}" class="alert alert-danger"
                                     role="alert"></div>
                                <div th:if="${msgprecio != null}" th:text="${msgprecio}" class="alert alert-danger"
                                     role="alert"></div>
                                <form method="post" th:action="@{'/venta/agregarVenta'}" th:object="${ventas}">
                                    <input type="hidden" th:field="*{idventas}"/>

                                    <br>

                                    <!-- ESCOGER TIENDA-->
                                    <div class="form-group">
                                        <h4 th:text="'Tienda : ' + ${tiendita.nombre}">TIENDA</h4>
                                       <input  type="hidden" th:name="tienda" th:value="${tiendita.idtienda}"  > </input>
                                    </div>

                                    <!-- RUC o DNI opcional -->
                                    <div>
                                        <label >RUC o DNI (opcional)</label>
                                        <input style="width: 40%" type="text" class="form-control" th:field="*{rucdni}">
                                        <div class="text-danger" th:if="${#fields.hasErrors('rucdni')}"
                                             th:errors="*{rucdni}"></div>
                                    </div>
                                    <!-- FIN -->
                                    <!-- Nombre ( a quién se le vendió) -->
                                    <div>
                                        <label >Nombre Comprador</label>
                                        <input style="width: 40%" type="text" class="form-control" th:field="*{nombrecomprador}">
                                        <div class="text-danger" th:if="${#fields.hasErrors('nombrecomprador')}"
                                             th:errors="*{nombrecomprador}"></div>
                                    </div>
                                    <!-- FIN -->
                                    <!-- TIPO DE DOCUMENTO/BOLETA/FACTURA -->
                                    <div>
                                        <label>Tipo de Documento</label>
                                        <select th:if="${ventas.tipodocumento==null}" class="form-control" name="tipodocumento" id="tipodocumento" style="width: 40%">
                                            <option value="Boleta">Boleta</option>
                                            <option value="Factura">Factura</option>
                                            <option value="Recibo">Recibo</option>
                                        </select>
                                        <select th:unless="${ventas.tipodocumento==null}" class="form-control" name="tipodocumento" id="tipodocumento" style="width: 40%">
                                            <option value="Boleta">Boleta</option>
                                            <option value="Factura">Factura</option>
                                            <option value="Recibo">Recibo</option>
                                            <option th:selected="${ventas.tipodocumento}" th:text="${ventas.tipodocumento}"></option>
                                        </select>
                                    </div>
                                    <!-- Número de documento físico (factura/boleta/recibo/transacción) -->
                                    <div>
                                        <label >Número de documento</label>
                                        <input style="width: 40%;margin: 0 0 1px 0" type="text" class="form-control" th:field="*{numerodocumento}"  >
                                        <label>N° boleta/factura/recibo</label>
                                        <div class="text-danger" th:if="${#fields.hasErrors('numerodocumento')}"
                                             th:errors="*{numerodocumento}"></div>
                                    </div>
                                    <!-- FIN -->
                                    <!-- Lugar de venta -->
                                    <div>
                                        <label>Lugar</label>
                                        <input style="width: 40%" type="text" class="form-control" th:field="*{lugarventa}">
                                        <div class="text-danger" th:if="${#fields.hasErrors('lugarventa')}"
                                             th:errors="*{lugarventa}"></div>
                                    </div>

                                    <div>
                                        <label>Metodo de Pago</label>
                                        <select th:if="${ventas.metodopago == null}" class="form-control" name="metodopago" id="metodopago" style="width: 40%">
                                            <option value="efectivo">Efectivo</option>
                                            <option value="tarjeta">Tarjeta de Credito</option>
                                        </select>
                                        <select th:unless="${ventas.metodopago == null}" class="form-control" name="metodopago" id="metodopago" style="width: 40%">
                                            <option value="efectivo">Efectivo</option>
                                            <option value="tarjeta">Tarjeta de Credito</option>
                                            <option th:selected="${ventas.metodopago}" th:text="${ventas.metodopago}"></option>
                                        </select>
                                    </div>
                                    <!-- FIN -->
                                    <!-- ELEGIR UN PRODUCTO (código)-->
                                    <div class="form-group" th:if="${ventas.nombrecomprador == null}" >
                                        <label for="inventariosede">Producto - Descripcion Producto - #Cantidad Disponible - $ Precio de venta</label>

                                        <select class="form-control" name="inventariosede" id="inventariosede" style="width: 70%">
                                            <option th:each=" pro : ${ProductosEnTienda}"
                                                    th:value="${pro.inventariosede.getIdiventariosede()}"
                                                    th:text="${pro.inventariosede.inventarioproductoidinventario.producto.nombreproducto} + ' - '
                                                    + ${pro.inventariosede.inventarioproductoidinventario.producto.descripcionproducto} + ' - '
                                                    +'#'+${pro.stocktienda} + ' - ' +'$'+ ${pro.inventariosede.inventarioproductoidinventario.preciomosqoy}">
                                            </option>
                                        </select>
                                    </div>
                                    <div>
                                        <label >Precio de venta</label>
                                        <input style="width: 40%" type="text" class="form-control" th:field="*{precioventa}">
                                        <div class="text-danger" th:if="${#fields.hasErrors('precioventa')}"
                                             th:errors="*{precioventa}"></div>
                                    </div>

                                    <div class="form-group" th:unless="${ventas.nombrecomprador == null}" >
                                        <label for="inventariosede">Producto - Descripcion Producto - #Cantidad Disponible - $ Precio de venta</label>

                                        <select class="form-control" name="inventariosede" id="inventariosede" style="width: 70%">
                                            <option th:each=" pro : ${ProductosEnTienda}"
                                                    th:value="${pro.inventariosede.getIdiventariosede()}"
                                                    th:text="${pro.inventariosede.inventarioproductoidinventario.producto.nombreproducto} + ' - '
                                                    + ${pro.inventariosede.inventarioproductoidinventario.producto.descripcionproducto} + ' - '
                                                    +'#'+${pro.stocktienda} + ' - ' +'$'+ ${pro.inventariosede.inventarioproductoidinventario.preciomosqoy}"
                                                    th:selected="${pro.inventariosede.idiventariosede == ventas.inventariosede.idiventariosede}">
                                            </option>
                                        </select>
                                    </div>

                                    <!- FIN -->

                                    <!-- FECHA DE VENTA -->
                                    <div>
                                        <label >fecha de venta</label>
                                        <input style="width: 40%;margin: 0 0 1px 0" type="text" class="form-control" th:field="*{fechaventa}" >
                                        <label>Formato: Mes/Dia/Año</label>
                                        <div class="text-danger" th:if="${#fields.hasErrors('fechaventa')}"
                                             th:errors="*{fechaventa}"></div>

                                    </div>
                                    <!-- FIN -->

                                    <!-- ELEGIR LA CANTIDAD -->
                                    <div>
                                        <label >Cantidad</label>
                                        <input style="width: 40%" type="text" class="form-control" th:field="*{cantidad}">
                                        <div class="text-danger" th:if="${#fields.hasErrors('cantidad')}"
                                             th:errors="*{cantidad}"></div>
                                    </div>
                                    <!-- FIN -->


                                    <a th:href="@{'/tienda'}" class="btn btn-danger">Cancelar</a>
                                    <button type="submit" class="btn btn-outline-danger"> finalizar</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>


<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>

</body>

</html>
