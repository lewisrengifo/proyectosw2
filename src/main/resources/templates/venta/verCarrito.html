<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='Lista de productos en carrito')">

</head>
<body>

<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->

    <div id="page-wrapper">

        <div class="header">
            <h1 class="page-header">
                Lista de productos en carrito
            </h1>
        </div>

        <div class="card-action">
            <a class="btn btn-primary right" th:href="@{'/venta/venta'}">Lista de productos en carrito</a>
        </div>
        <!-- /. COMUNIDAD  -->
        <div id="page-inner">
            <!-- /. COMUNIDAD  -->
            <div class="row " >
                <div class="col-md-10 padding">
                    <div class="card">
                        <div class="card-content">
                            <div class="table-responsive">
                                <div th:if="${msgAr != null}" th:text="${msgAr}" class="alert alert-success"
                                     role="alert"></div>

                                <table class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr class="info">
                                        <th>#</th>
                                        <th class="center">Nombre Producto</th>
                                        <th class="center">Código Producto</th>
                                        <th class="center">Descripción Producto</th>
                                        <th class="center">Línea</th>
                                        <th class="center">Precio unitario</th>
                                        <th class="center">Cantidad</th>
                                        <th class="center"></th>
                                        <th class="center"></th>
                                    </tr>
                                    </thead>

                                    <tbody>
                                    <tr th:each="productoVenta, info : ${carritoLista}">
                                        <form method="post" th:object="${productoVenta}" th:action="@{'/venta/terminar'}" enctype="multipart/form-data">
                                            <td th:text="${info}"></td>
                                            <td th:text="${inventarioproducto.getProducto().getNombreproducto()}"></td>
                                            <td th:text="${inventarioproducto.getProducto().getCodigoproducto()}"></td>
                                            <td th:text="${inventarioproducto.getProducto().getDescripcionproducto()}"></td>
                                            <td th:text="${inventarioproducto.getPreciomosqoy()}"></td>
                                            <td th:text="${inventarioproducto.getProducto().getLinea()}"></td>
                                            <td><a input type="text" class="form-control" th:field="*{cantidad}" placeholder="Cant." style="width: 25%"></a>1</td>
                                            <button type="submit" class=" btn btn-info btn-responsive btninter rigth" th:if="${*{cantidad} > 0?  ${msgAr}=='Agregado con exito al carrito': ${msgAr}=='No se puede agregar, ingrese un valor válido'}">Agregar</button>
                                        </form>
                                    </tr>

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <!-- End  Kitchen Sink -->
                </div>
            </div>
        </div>

    </div>
</div>
<!-- /. PAGE WRAPPER  -->
<!-- /. WRAPPER  -->
<!-- JS Scripts-->


<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>
<script >
    function abrir() {
        document.getElementById("vent").style.display="block";
    }
    function cerrar() {
        document.getElementById("vent").style.display="none";
    }

</script>

</body>

</html>
