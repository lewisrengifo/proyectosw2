<!DOCTYPE html>

    <div id="page-wrapper">

        <div class="header">
            <h1 class="page-header">
                Lista de Ventas
            </h1>
        </div>


        <!-- /. COMUNIDAD  -->
        <div id="page-inner">


            <!-- /. COMUNIDAD  -->
            <div class="row ">
                <div class="col-md-12 padding">
                    <div class="card">

                        <div class="card-content">
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr class="info">
                                        <th class="center">#</th>
                                        <th class="center">Tienda</th>
                                        <th class="center">Fecha de Venta</th>
                                        <th class="center">Tipo de Documento</th>
                                        <th class="center">N° documento de venta</th>
                                        <th class="center">Ruc / Dni</th>
                                        <th class="center">Nombre cliente</th>
                                        <th class="center">Cantidad</th>
                                        <th class="center">Codigo generado</th>
                                        <th class="center">Nombre producto</th>
                                        <th class="center">Color Producto</th>
                                        <th class="center">Precio Venta</th>
                                        <th class="center">Medio de pago</th>
                                    </tr>
                                    </thead>

                                    <tbody>
                                    <tr th:each="venta, info : ${listaVentas}">
                                        <td class="center" th:text="${( info.index +1) }"></td>
                                        <td class="center" th:text="${venta.tienda.idtienda}==0 ? '--': ${venta.tienda.nombre} " ></td>
                                        <td class="center" th:text="${venta.fechaventa}"></td>
                                        <td class="center" th:text="${venta.tipodocumento}"></td>
                                        <td class="center" th:text="${venta.numerodocumento}"></td>
                                        <td class="center" th:text="${venta.rucdni}"></td>
                                        <td class="center" th:text="${venta.nombrecomprador}"></td>
                                        <td class="center" th:text="${venta.cantidad}"></td>
                                        <td class="center" th:text="${venta.inventariosede.inventarioproductoidinventario.codigogenerado}"></td>
                                        <td class="center" th:text="${venta.inventariosede.inventarioproductoidinventario.producto.nombreproducto}"></td>
                                        <td class="center" th:text="${venta.inventariosede.inventarioproductoidinventario.color}"></td>
                                        <td class="center" th:text="${venta.inventariosede.inventarioproductoidinventario.preciomosqoy}"></td>
                                        <td class="center" th:text="${venta.metodopago}"></td>

                                    </tr>

                                    </tbody>
                                </table>

                                                <a class="page-link" th:unless="${busqueda}"
                                                   th:href="@{'/producto' + '?page=' + ${prev}} "> Anterior </a>

                                            </li>

                                        </ul>

                                    </div>
                                </div>
                                -->
                            </div>
                        </div>
                    </div>
                    <!-- End  Kitchen Sink -->
                </div>
            </div>
        </div>

    </div>
</div>
