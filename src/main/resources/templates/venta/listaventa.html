<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='Lista de productos')">

</head>
<body>

<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->

    <div id="page-wrapper">

        <div class="header">
            <h1 class="page-header">
                Lista de Ventas
            </h1>
        </div>


        <!-- /. COMUNIDAD  -->
        <div id="page-inner">
            <form method="get" th:action="@{'/venta/buscador'}">

                <input th:if="${busqueda!=null}" th:value="${busqueda}" name="searchField"
                       class="form-control mb-3" type="text" placeholder="Buscar"
                       aria-label="Search" style="width: 40%">
                <input th:if="${busqueda==null}" name="searchField" class="form-control mb-3" type="text"
                       placeholder="Buscar"
                       aria-label="Search" style="width: 40%">
                <div th:if="${msgBuscador != null}" th:text="${msgBuscador}" style="color: #ac2925"></div>

                <button type="submit" class="btn btn-outline-danger">buscar</button>
                <a th:href="@{'/venta/lista'}" class="btn btn-outline-danger">Limpiar</a>

            </form>


            <!-- /. COMUNIDAD  -->
            <div class="row ">
                <div class="col-md-12 padding">
                    <div class="card">

                        <div class="card-content">
                            <div class="table-responsive">
                                <div th:if="${msgPagina != null}" th:text="${msgPagina}" class="alert alert-warning"
                                     role="alert"></div>


                                <table class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr class="info">
                                        <th>#</th>
                                        <th class="center">Tienda</th>
                                        <th class="center">Fecha de Venta</th>
                                        <th class="center">Tipo de Documento</th>
                                        <th class="center">N° documento de venta</th>
                                        <th class="center">Ruc / Dni</th>
                                        <th class="center">Nombre cliente</th>
                                        <th class="center">Cantidad</th>
                                        <th class="center">Codigo generado</th>
                                        <th class="center">Nombre producto</th>
                                        <th class="center">Color Producto</th>
                                        <th class="center">Precio Venta</th>
                                        <th class="center">Medio de pago</th>
                                    </tr>
                                    </thead>

                                    <tbody>
                                    <tr th:if="${totalElementos} > 0 " th:each="venta, info : ${listaVentas}">
                                        <td th:text="${( info.index +1) }"></td>
                                        <td th:text="${venta.tienda.idtienda}==0 ? '--': ${venta.tienda.nombre} " ></td>
                                        <td th:text="${venta.fechaventa}"></td>
                                        <td th:text="${venta.tipodocumento}"></td>
                                        <td th:text="${venta.numerodocumento}"></td>
                                        <td th:text="${venta.rucdni}"></td>
                                        <td th:text="${venta.nombrecomprador}"></td>
                                        <td th:text="${venta.cantidad}"></td>
                                        <td th:text="${venta.inventariosede.inventarioproductoidinventario.codigogenerado}"></td>
                                        <td th:text="${venta.inventariosede.inventarioproductoidinventario.producto.nombreproducto}"></td>
                                        <td th:text="${venta.inventariosede.inventarioproductoidinventario.color}"></td>
                                        <td th:text="${venta.inventariosede.inventarioproductoidinventario.preciomosqoy}"></td>
                                        <td th:text="${venta.metodopago}"></td>

                                    </tr>

                                    <tr th:unless="${totalElementos} > 0" >
                                        <h1> No hay Ventas</h1>

                                    </tr>

                                    </tbody>
                                </table>
                                <div class="row">
                                    <div class="col-md-4"></div>
                                    <div class="col-md-8">

                                        <ul th:if="${last != 1}" class="pagination justify-content-center">
                                            <li class ="page-item" th:if="${current != 1 }">
                                                <a class="page-link"  th:if="${busqueda }" th:href="@{'/venta/buscador' + '?page=' + ${prev} + '&' + 'searchField='+ ${busqueda}} "> Anterior </a>
                                                <a class="page-link" th:unless="${busqueda}" th:href="@{'/venta' + '?page=' + ${prev}} "> Anterior </a>
                                            </li>

                                            <li class ="page-item" th:each="page:${pages}" th:classappend="${current == page ? 'active' : ''}" >
                                                <a class="page-link" th:if="${busqueda}" th:href="@{'/venta/buscador' + '?searchField='+ ${busqueda} + '&' + 'page=' + ${page}} " th:text="${page}"  ></a>
                                                <a class="page-link" th:unless="${busqueda}" th:href="@{'/venta' + '?page=' + ${page}} " th:text="${page}"  ></a>
                                            </li>

                                            <li class ="page-item" th:if="${current != last }">
                                                <a class="page-link"  th:if="${busqueda}" th:href="@{'/venta/buscador' + '?page=' + ${next} + '&' + 'searchField='+ ${busqueda}} "> Siguiente </a>
                                                <a class="page-link" th:unless="${busqueda}" th:href="@{'/venta' + '?page=' + ${next}} "> Siguiente </a>
                                            </li>

                                        </ul>


                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- End  Kitchen Sink -->
                </div>
            </div>
        </div>

    </div>
</div>
<!-- /. PAGE WRAPPER  -->
<!-- /. WRAPPER  -->
<!-- JS Scripts-->


<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>


</body>

</html>
