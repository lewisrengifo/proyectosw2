<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='Lista de Productos para agregar al Carrito')">

</head>
<body>

<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->

    <div id="page-wrapper">

        <div class="header">
            <h1 class="page-header">
                Lista de Productos para agregar al Carrito
            </h1>
        </div>

        <div class="card-action">
            <a class="btn btn-primary right" th:href="@{'/venta/venta'}">Ver carrito</a>
        </div>
        <!-- /. COMUNIDAD  -->
        <div id="page-inner">
            <div class="col-xs-4">
                <form class="header " method="post" th:action="@{'/venta/search'}">
                    <input th:if="${searchField!=null}" th:value="${searchField}" name="search"
                           type="text" class="form-control" placeholder="Texto a buscar" >
                    <input th:if="${searchField==null}" name="search" class="form-control mb-3" type="text"
                           placeholder="Buscar"
                           aria-label="Search" style="width: 40%">
                    <div class="input-group-append">
                        <div th:if="${msgPagina != null}" th:text="${msgPagina}" class="alert alert-info"
                             role="alert"></div>
                        <div th:if="${msgBuscador != null}" th:text="${msgBuscador}" class="alert alert-danger"
                             role="alert"></div>
                        <button class="btn btn-outline-primary " type="submit">Buscar</button>
                        <a th:href="@{'/venta'}" class="btn btn-outline-danger">Limpiar</a>
                    </div>
                </form>
            </div>


            <!-- /. COMUNIDAD  -->
            <div class="row " >
                <div class="col-md-10 padding">
                    <div class="card">
                        <div class="card-content">
                            <div class="table-responsive">
                                <div th:if="${msgAr != null}" th:text="${msgAr}" class="alert alert-success"
                                     role="alert"></div>

                                <table class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr class="info">
                                        <th>#</th>
                                        <th class="center">Nombre Producto</th>
                                        <th class="center">Código Producto</th>
                                        <th class="center">Descripción Producto</th>
                                        <th class="center">Línea</th>
                                        <th class="center">Precio unitario</th>
                                        <th class="center">Cantidad</th>
                                        <th class="center"></th>
                                        <th class="center"></th>
                                    </tr>
                                    </thead>

                                    <tbody>
                                    <tr th:each="inventarioproducto, info : ${listaProductosStock}">
                                        <form method="post" th:action="@{'/venta/agregarAlCarrito'}" enctype="multipart/form-data" th:object="${productoVenta}">
                                            <td th:text="${( info.index +1) + (prev)*10}"></td>
                                            <td th:text="${inventarioproducto.getProducto().getNombreproducto()}"></td>
                                            <td th:text="${inventarioproducto.getProducto().getCodigoproducto()}"></td>
                                            <td th:text="${inventarioproducto.getProducto().getDescripcionproducto()}"></td>
                                            <td th:text="${inventarioproducto.getPreciomosqoy()}"></td>
                                            <td th:text="${inventarioproducto.getProducto().getLinea()}"></td>
                                            <td><a input type="text" class="form-control" th:field="${productoVenta.cantidad}" style="width: 25%"></a>

                                            <td><a input type="text" class="form-control" th:value="${inventarioproducto==productoVenta}" style="width: 25%">Enviar al carrito</a>
                                            </td>
                                            <button type="submit" class=" btn btn-info btn-responsive btninter rigth" th:text="${productoVenta.cantidad == '' && (productoVenta.cantidad) > 0?  ${msgAr}=='Agregado con exito al carrito': ${msgAr}=='No se puede agregar, ingrese un valor válido'}">Agregar</button>
                                            </button>

                                        </form>
                                    </tr>

                                    </tbody>
                                </table>

                                <div class="row">
                                    <div class="col-md-4"></div>
                                    <div class="col-md-8">
                                        <ul th:if="${last != 1}" class="pagination justify-content-center">
                                            <li class ="page-item" th:if="${current != 1 }">
                                                <a class="page-link"  th:if="${busqueda }" th:href="@{'/venta/search' + '?page=' + ${prev} + '&' + 'search='+ ${busqueda}} "> Anterior </a>
                                                <a class="page-link" th:unless="${busqueda}" th:href="@{'/venta' + '?page=' + ${prev}} "> Anterior </a>
                                            </li>

                                            <li class ="page-item" th:each="page:${pages}" th:classappend="${current == page ? 'active' : ''}" >
                                                <a class="page-link" th:if="${busqueda}" th:href="@{'/venta/search' + '?search='+ ${busqueda} + '&' + 'page=' + ${page}} " th:text="${page}"  ></a>
                                                <a class="page-link" th:unless="${busqueda}" th:href="@{'/venta' + '?page=' + ${page}} " th:text="${page}"  ></a>
                                            </li>

                                            <li class ="page-item" th:if="${current != last }">
                                                <a class="page-link"  th:if="${busqueda}" th:href="@{'/venta/search' + '?page=' + ${next} + '&' + 'search='+ ${busqueda}} "> Siguiente </a>
                                                <a class="page-link" th:unless="${busqueda}" th:href="@{'/venta' + '?page=' + ${next}} "> Siguiente </a>
                                            </li>

                                        </ul>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- End  Kitchen Sink -->
                </div>
            </div>
        </div>

    </div>
</div>
<!-- /. PAGE WRAPPER  -->
<!-- /. WRAPPER  -->
<!-- JS Scripts-->


<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>
<script >
    function abrir() {
        document.getElementById("vent").style.display="block";
    }
    function cerrar() {
        document.getElementById("vent").style.display="none";
    }

</script>

</body>

</html>
