<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='lista de productooos')">
</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->
    <div id="page-wrapper">

        <!-- /. CATEGORIA  -->
        <div id="page-inner">
            <!-- /. CATEGORIA  -->
            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-action">
                            LINEA
                            <a class="btn btn-primary right" th:href="@{'/linea/nuevo'}">agregar</a>
                        </div>
                        <div class="card-content">
                            <div class="table-responsive">
                                <div th:if="${msg != null}" th:text="${msg}" class="alert alert-success"
                                     role="alert"></div>

                                <table class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>NOMBRE</th>
                                        <th>CÓDIGO</th>
                                        <th></th>
                                        <th></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="c, info : ${lista}">
                                        <td th:text="${info.index +1}">1</td>
                                        <td th:text="${c.nombrelinea}">Home</td>
                                        <td th:text="${c.codigolinea}">Home</td>
                                        <td><a th:href="@{'linea/editar?id=' + ${c.idlinea}}"> editar</a></td>
                                        <td><a th:href="@{'linea/borrar?id=' + ${c.idlinea}}">borrar</a></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <!-- End  Kitchen Sink -->
                </div>
            </div>
        </div>
    </div>
</div>
<!-- /. PAGE WRAPPER  -->
<!-- /. WRAPPER  -->
<!-- JS Scripts-->

<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>

</body>

</html>
