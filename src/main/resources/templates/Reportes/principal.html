<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='Inventario Principal')">
</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->
    <div id="page-wrapper">
        <div class="header">
            <h1 class="page-header">
                Reporte General
            </h1>
        </div>
        <div id="page-inner">
            <div class="row">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-content">
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr class="info">
                                        <th>#</th>
                                        <th>Caracteristica</th>
                                        <th>Opcion</th>
                                        <th>Excel</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr >
                                        <form method="post" th:action="@{'/ventasexcel/mensual'}">
                                            <td>1</td>
                                            <td>Ventas total del Mes</td>
                                            <td>
                                                <div class="form-group" >
                                                    <select class="form-control" name="mes" id="mes" style="width: 80%">
                                                        <option value="mes" th:text="Enero"></option>
                                                        <option value="mes" th:text="Febrero"></option>
                                                        <option value="mes" th:text="Marzo"></option>
                                                        <option value="mes" th:text="Abril"></option>
                                                        <option value="mes" th:text="Mayo"></option>
                                                        <option value="mes" th:text="Junio"></option>
                                                        <option value="mes" th:text="Julio"></option>
                                                        <option value="mes" th:text="Agosto"></option>
                                                        <option value="mes" th:text="Septiembre"></option>
                                                        <option value="mes" th:text="Octubre"></option>
                                                        <option value="mes" th:text="Noviembre"></option>
                                                        <option value="mes" th:text="Diciembre"></option>
                                                    </select>
                                                </div>
                                            </td>
                                            <td><button type="submit" class="btn btn-outline-info">Exportar Reporte</button></td>
                                        </form>

                                    </tr>
                                    <tr >
                                        <td>2</td>
                                        <td>Ventas total del Trimestre</td>
                                        <td >
                                            <div class="form-group" >
                                                <select class="form-control" name="trimiestre" id="trimiestre" style="width: 80%">
                                                    <option value="trimiestre" th:text="Primero"></option>
                                                    <option value="trimiestre" th:text="Segundo"></option>
                                                    <option value="trimiestre" th:text="Tecer"></option>
                                                    <option value="trimiestre" th:text="Cuarto"></option>
                                                </select>
                                                    <input  type="text" class="form-control" value="1980 " name="anotri" id="anotri" style="width: 10%">
                                            </div>
                                        </td>
                                        <td><a href="#">Exportar Reporte</a></td>
                                    </tr>
                                    <tr >
                                        <td>2</td>
                                        <td>Ventas total del Ano</td>
                                        <td>
                                            <div class="form-group" >
                                                <input type="text" class="form-control" value="1980 " name="ano" id="ano" style="width: 10%">
                                            </div>
                                        </td>
                                        <td><a href="#">Exportar Reporte</a></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>



    </div>
</div>


<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>

</body>

</html>
