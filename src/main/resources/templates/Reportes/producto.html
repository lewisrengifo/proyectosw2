<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='Reporte por producto')">
</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->
    <div id="page-wrapper">
        <div class="header">
            <h1 class="page-header">
                Reporte Producto
            </h1>
        </div>
        <div id="page-inner">
            <div class="row">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-content">
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr class="info">
                                        <th>#</th>
                                        <th>Caracteristica</th>
                                        <th>Comunidad</th>
                                        <th>Opcion</th>
                                        <th>Excel</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr >
                                        <form method="post" th:action="@{'/ventasexcel/ano/producto'}">
                                            <td>1</td>
                                            <td>Ventas total del Año</td>
                                            <td>
                                                <div class="form-group">
                                                    <select class="form-control" name="producto" id="producto" style="width: 40%">
                                                        <option th:each=" ar : ${listaProducto}"
                                                                th:value="${ar.idproducto}"
                                                                th:text="${ar.nombreproducto}">

                                                        </option>
                                                </div>
                                            </td>
                                            <td>
                                                <div class="form-group" >
                                                    <input type="text" class="form-control" value="1980" name="ano" id="ano" style="width: 20%">
                                                </div>
                                            </td>
                                            <td><button type="submit" class="btn btn-outline-info">Exportar Reporte</button></td>
                                        </form>

                                    </tr>
                                    <tr >
                                        <form method="post" th:action="@{'/ventasexcel/anomes/producto'}">
                                            <td>2</td>
                                            <td>Ventas total del Mes</td>
                                            <td>
                                                <div class="form-group">
                                                    <select class="form-control" name="producto" id="producto" style="width: 40%">
                                                        <option th:each=" ar : ${listaProducto}"
                                                                th:value="${ar.idproducto}"
                                                                th:text="${ar.nombreproducto}">

                                                        </option>
                                                </div>
                                            </td>
                                            <td >
                                                <div class="form-group" >
                                                    <select class="form-control" name="mes" id="mes" style="width: 80%">
                                                        <option >Enero</option>
                                                        <option  >Febrero</option>
                                                        <option >Marzo</option>
                                                        <option >Abril</option>
                                                        <option >Mayo</option>
                                                        <option >Junio</option>
                                                        <option  >Julio</option>
                                                        <option  >Agosto</option>
                                                        <option  >Septiembre</option>
                                                        <option  >Octubre</option>
                                                        <option >Noviembre</option>
                                                        <option  >Diciembre</option>
                                                    </select>

                                                    <input  type="text" class="form-control" value="1980 " name="anomes" id="anomes" style="width: 20%">
                                                </div>
                                            </td>
                                            <td><button type="submit" class="btn btn-outline-info">Exportar Reporte</button></td>

                                        </form>

                                    </tr>
                                    <tr >
                                        <form method="post" th:action="@{'/ventasexcel/trimestre/producto'}">
                                            <td>2</td>
                                            <td>Ventas total del Trimestre</td>
                                            <td>
                                                <div class="form-group">
                                                    <select class="form-control" name="producto" id="producto" style="width: 40%">
                                                        <option th:each=" ar : ${listaProducto}"
                                                                th:value="${ar.idproducto}"
                                                                th:text="${ar.nombreproducto}">

                                                        </option>
                                                </div>
                                            </td>
                                            <td >
                                                <div class="form-group" >
                                                    <select class="form-control" name="trimestre" id="trimestre" style="width: 80%">
                                                        <option >Primero</option>
                                                        <option >Segundo</option>
                                                        <option >Tercero</option>
                                                        <option >Cuarto</option>
                                                    </select>
                                                    <input  type="text" class="form-control" value="1980" name="anotri" id="anotri" style="width: 20%">
                                                </div>
                                            </td>
                                            <td><button type="submit" class="btn btn-outline-info">Exportar Reporte</button></td>
                                        </form>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <!--<div class="card-action">
                                <h2>Generar reportes por</h2>
                                <br>
                                <a class="btn btn-outline-danger" th:href="@{'/ventasexcel'}">Sede</a>
                                <a class="btn btn-outline-danger" th:href="@{'/ventasexcel'}">Comunidad</a>
                                <a class="btn btn-outline-danger" th:href="@{'/ventasexcel'}">Artículo</a>
                                <a class="btn btn-outline-danger" th:href="@{'/ventasexcel'}">Cliente</a>
                            </div>-->


                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>

</body>

</html>
