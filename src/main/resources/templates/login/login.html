<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"/>
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <link rel="stylesheet" type="text/css"  th:href="@{'/css/bootstrap.css'}" >
</head>
<body >
<div class="wrap-login100">
    <form class="login100-form" th:action="@{/processlogin}" method="post">
	    <span class="login100-form-title p-b-43">
						Mosqoy
        </span>
        <br>
        <div align="center">
            <h5  th:if="${param.error}" class="alert alert-danger" style="color:#ff0000;padding: 10px;width: 370px"><strong>Acceso Denegado</strong></h5>
        </div>
        <div align="center" th:if="${msg != null}" th:text="${msg}" class="alert alert-success" role="alert"></div>
        <div align="center" th:if="${msg2 != null}" th:text="${msg2}" class="alert alert-danger" role="alert"></div>

        <div class="container" style="width: auto" >
            <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="addon-wrapping" name="correo">
        </div>
        <br>
        <div class="container" style="width: auto">
            <input type="password" class="form-control" placeholder="Password" aria-label="Password" aria-describedby="addon-wrapping" name="password">
        </div>
        <br>

        <div align="center">
            <a class="nav-link" th:href="@{/olvidoContrasenia}">Olvide mi contraseña</a>
        </div>
        <br>
        <input type="submit" class="btn btn-info btn-block" value="Iniciar Sesion" style="width: 250px;margin: auto">
    </form >
    <div class="login100-more" >
        <img width="99.8%" th:src="@{'/img/foto.jpg'}" style="min-height: 100vh">
    </div>
</div>
</body>
</html>
