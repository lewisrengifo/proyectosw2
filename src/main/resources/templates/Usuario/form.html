                                    <label for="Nombre">Nombre del usuario</label>
                                    <input type="text" style="width: 88%" class="form-control" th:field="*{nombre}">
                                    <div class="text-danger" th:if="${#fields.hasErrors('nombre')}"
                                         th:errors="*{nombre}"></div>
                                </div>
                                <div class="form-group">
                                    <label for="Apellido">Apellido del usuario</label>

                                         th:errors="*{apellido}"></div>
                                </div>
                                <div class="form-group">
                                    <label for="DNI">DNI del usuario</label>
                                    <input style="width: 88%" type="text" class="form-control" th:field="*{dni}">
                                    <div class="text-danger" th:if="${#fields.hasErrors('dni')}"
                                         th:errors="*{dni}"></div>
                                </div>
                                <div class="form-group">
                                    <label for="Correo">Correo</label>
                                    <input style="width: 88%" type="text" class="form-control" th:field="*{correo}">
                                    <div class="text-danger" th:if="${#fields.hasErrors('correo')}"
                                         th:errors="*{correo}"></div>
                                </div>
                                <div class="form-group" th:if="*{idusuario==0}">
                                    <label for="Contraseña">Contraseña</label>

                                <div class="form-group">
                                    <label for="enable">Definir estado</label>


                                    <select style="width: 90%" th:if="*{idusuario==0}" class="form-control"
                                            name="enable" id="enable">
                                        <option th:value="1">Activado</option>
                                        <option th:value="0">Desactivado</option>
                                    </select>
                                    <select style="width: 90%" th:unless="*{idusuario==0}" class="form-control"
                                            name="enable" id="enable">

                                        <option th:text="Activado" th:selected="*{enable == true}"
                                                th:value="1"></option>
                                        <option th:text="Desactivado" th:selected="*{enable == false}"
                                                th:value="0"></option>
                                    </select>
                                    <div class="text-danger" th:if="${#fields.hasErrors('enable')}"
                                         th:errors="*{enable}"></div>
                                </div>
