<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/leftbar.html :: cabecera(titulo='lista de productooos')">
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>
    <div id="page-wrapper">
        
        <h2 class="page-header">Lista Usuarios</h2>
        <div id="page-inner">
            <div>
                <form method="post" th:action="@{'/usuario/buscador'}">
                    <input name="searchField" class="form-control mb-3" type="text" placeholder="Buscar" aria-label="Search" style="width: 40%">
                    <button type="submit" class="btn btn-outline-danger">buscar</button>
                    <a th:href="@{'/usuario/lista'}" class="btn btn-outline-danger">Limpiar</a>
                </form>
            </div>
            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-action">
                            <a class="btn btn-primary mt-4 mb-4" th:href="@{'/usuario/nuevo'}">Nuevo Usuario</a>
                        </div>
                            <div class="card-content">
                                <div class="table-responsive">
                                    <div th:if="${msg != null}" th:text="${msg}" class="alert alert-success"
                                         role="alert"></div>
                                    <div th:if="${msgsede != null}" th:text="${msgsede}" class="alert alert-danger"
                                         role="alert"></div>
                                    <div th:if="${msgsdni != null}" th:text="${msgdni}" class="alert alert-danger"
                                         role="alert"></div>
                                    <div th:if="${msgcorreo != null}" th:text="${msgcorreo}" class="alert alert-danger"
                                         role="alert"></div>


                                    <table class="table table-striped table-bordered table-hover">
                                        <tr>
                                            <th>#</th>
                                            <th>Nombre</th>
                                            <th>Correo</th>


                                            <th>Rol</th>
                                            <th>DNI</th>
                                            <th>Sede</th>
                                            <th>Estado</th>

                                            <th></th>

                                        </tr>
                                        <tr th:each="usuario, info : ${listaUsuarios}">
                                            <td th:text="${info.index + 1}"></td>
                                            <td th:text="${usuario.nombre}"></td>
                                            <td th:text="${usuario.correo}"></td>


                                            <td th:text="${usuario.rol_idrol.nombre}"></td>
                                            <td th:text="${usuario.dni}"></td>
                                            <td th:if="${usuario.sede_idrol==null}">Sin sede</td>
                                            <td th:unless="${usuario.sede_idrol==null}" th:text="${usuario.sede_idrol.sede}"></td>
                                            <td th:if="${usuario.enable == true}" th:text="Activado"></td>
                                            <td th:if="${usuario.enable == false}" th:text="Desactivado"></td>

                                            <td><a class="btn btn-primary"
                                                   th:href="@{'/usuario/editar' + '?id=' + ${usuario.idusuario}}">Editar</a>
                                            </td>

                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>
</body>
</html>
