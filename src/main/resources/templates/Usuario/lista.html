<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/leftbar.html :: cabecera(titulo='Lista de Usuarios')">
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>
    <div id="page-wrapper">

        <h2 class="page-header">Lista Usuarios</h2>
        <div id="page-inner">
            <div>
                <form method="get" th:action="@{'/usuario/buscador'}">

                    <input th:if="${searchField!=null}" th:value="${searchField}" name="searchField"
                           class="form-control mb-3" type="text" placeholder="Buscar"
                           aria-label="Search" style="width: 40%">
                    <input th:if="${searchField==null}" name="searchField" class="form-control mb-3" type="text"
                           placeholder="Buscar"
                           aria-label="Search" style="width: 40%">
                    <div th:if="${msgBuscador != null}" th:text="${msgBuscador}" style="color: #ac2925"></div>
                    <button type="submit" class="btn btn-outline-danger">buscar</button>
                    <a th:href="@{'/usuario/lista'}" class="btn btn-outline-danger">Limpiar</a>

                </form>
                <br>
            </div>
            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-action">
                            <a class="btn btn-outline-danger" th:href="@{'/usuario/nuevo'}">Nuevo Usuario</a>
                            <div th:text="|Total de usuarios : ${totalItems}|"></div>
                        </div>
                        <div class="card-content">
                            <div class="table-responsive">
                                <div th:if="${msg != null and msgsede == null}" th:text="${msg}"
                                     class="alert alert-success"
                                     role="alert"></div>
                                <div th:if="${msgsede != null}" th:text="${msgsede}" class="alert alert-danger"
                                     role="alert"></div>
                                <div th:if="${msgsdni != null}" th:text="${msgdni}" class="alert alert-danger"
                                     role="alert"></div>
                                <div th:if="${msgcorreo != null}" th:text="${msgcorreo}" class="alert alert-danger"
                                     role="alert"></div>


                                <table class="table table-striped table-bordered table-hover">
                                    <tr>
                                        <th>#</th>
                                        <th>Nombre</th>
                                        <th>Correo</th>


                                        <th>Rol</th>
                                        <th>DNI</th>
                                        <th>Sede</th>
                                        <th>Estado</th>

                                        <th></th>

                                    </tr>
                                    <tr th:each="usuario, info : ${listaUsuarios}">
                                        <td th:text="${info.index + 1 + prev*5}"></td>
                                        <td th:text="${usuario.nombre}"></td>
                                        <td th:text="${usuario.correo}"></td>


                                        <td th:text="${usuario.rol_idrol.nombre}"></td>
                                        <td th:text="${usuario.dni}"></td>
                                        <td th:if="${usuario.sede_idsede==null}">Sin sede</td>
                                        <td th:unless="${usuario.sede_idsede==null}"
                                            th:text="${usuario.sede_idsede.nombre}"></td>
                                        <td th:if="${usuario.enable == true}" th:text="Activado"></td>
                                        <td th:if="${usuario.enable == false}" th:text="Desactivado"></td>

                                        <td><a class="btn btn-outline-danger"
                                               th:href="@{'/usuario/editar' + '?id=' + ${usuario.idusuario}}">Editar</a>
                                        </td>

                                    </tr>
                                </table>
                                <div class="row">
                                    <div class="col-md-2"></div>
                                    <div class="col-md-8">

                                        <br>

                                        <ul th:if="${last != 1}" class="pagination justify-content-center">

                                            <li class="page-item" th:classappend="${prev == 0 ? 'disabled': '' }">
                                                <a th:if="${searchField.isEmpty()}" class="page-link"
                                                   th:href="@{'/usuario' + '?page=' + ${prev}} ">
                                                    Anterior </a>
                                                <a th:unless="${searchField.isEmpty()}" class="page-link"
                                                   th:href="@{'/usuario/buscador' + '?searchField=' +${searchField}+ '&page==' + ${prev}} ">
                                                    Anterior </a>

                                            <li class="page-item" th:each="page:${page}"
                                                th:classappend="${current == page ? 'active' : ''}">
                                                <a th:if="${searchField.isEmpty()}" class="page-link"
                                                   th:href="@{'/usuario' + '?page=' + ${page}} "
                                                   th:text="${page}"></a>
                                                <a th:unless="${searchField.isEmpty()}" class="page-link"
                                                   th:href="@{'/usuario/buscador' + '?searchField=' +${searchField}+ '&page=' + ${page}} "
                                                   th:text="${page}"></a>

                                            </li>

                                            <li class="page-item" th:classappend="${current == last ? 'disabled': '' }">
                                                <a th:if="${searchField.isEmpty()}" class="page-link"
                                                   th:href="@{'/usuario' + '?page=' + ${next}} ">
                                                    Siguiente </a>
                                                <a th:unless="${searchField.isEmpty()}" class="page-link"
                                                   th:href="@{'/usuario/buscador' + '?searchField=' +${searchField}+ '&page=' + ${next}} ">
                                                    Siguiente </a>

                                        </ul>

                                    </div>
                                    <div class="col-md-2"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>
</body>
</html>
