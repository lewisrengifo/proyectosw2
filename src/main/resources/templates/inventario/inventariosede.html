<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/leftbar.html :: cabecera(titulo = 'Inventario sede')">

    <script>
        $(document).ready(function () {

            $("#recibido").click(function () {
                $("#bottttton").style.display = 'block';
            });
        });
    </script>

</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->
    <div id="page-wrapper">
        <div class="header">
            <h1 class="page-header">
                INVENTARIO SEDE
            </h1>
        </div>

        <!-- /. COMUNIDAD  -->
        <div id="page-inner">

            <div class="row">
                <div class="col-md-12">
                    <div class="card">

                        <div class="card-content">

                            <div class="table-responsive">


                                <table class="table table-striped table-bordered table-hover">
                                    <thead>

                                    <tr class="info">

                                        <th>Nombre Producto</th>
                                        <th>Stock</th>
                                        <th>Fecha de llegada</th>
                                        <th>Nombre de la sede</th>
                                        <th>Estado del producto</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="inv : ${listaInventarioSede}">


                                        <td th:text="${inv.getInventarioproductoidinventario().getProducto().nombreproducto}"></td>
                                        <td th:text="${inv.stock}">de31edae</td>
                                        <td th:text="${inv.getFechallegada()}">---</td>
                                        <td th:text="${inv.sede.nombre}"></td>
                                        <td th:text="${inv.getEstado()}"></td>

                                        <!--
                                        <td><select class="form-control" name="estado" id="estado" style="width: 41%">
                                            <option id="enviado" value="enviado" selected th:text="${inv.getEstado()}">
                                            </option>
                                            <option id="recibido" th:text="|recibido por sede|"
                                                    th:value="|recibido por sede|">
                                            </option>

                                        </select>
                                        -->

                                            <form method="post" th:action="@{''}">
                                                <button style="display: none" id="bottttton" type="submit"
                                                        class=" btn btn-info btn-responsive btninter rigth"
                                                >Enviar
                                                </button>
                                            </form>
                                        </td>


                                    </tr>

                                    </tbody>

                                </table>
                                <br>
                                <div class="row">
                                    <div class="col-md-4"></div>
                                    <div class="col-md-8">

                                        <ul th:if="${last != 1}" class="pagination justify-content-center">

                                            <li  class ="page-item" th:if="${current != 1 }">

                                                <a class="page-link"  th:href="@{'/inventarioSede' + '?page=' + ${prev}} "> Anterior </a>

                                            <li class ="page-item" th:each="page:${pages}" th:classappend="${current == page ? 'active' : ''}">
                                                <a class="page-link"  th:href="@{'/inventarioSede' + '?page=' + ${page}} " th:text="${page}"></a>

                                            </li>

                                            <li  class ="page-item" th:if="${current != last }">
                                                <a class="page-link"  th:href="@{'/inventarioSede' + '?page=' + ${next}} "> siguiente </a>


                                        </ul>

                                    </div>
                                </div>



                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>


<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>

</body>

</html>
