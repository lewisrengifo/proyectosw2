<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/leftbar.html :: cabecera(titulo = 'Inventario sede')">


</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->
    <div id="page-wrapper">
        <div class="header">
            <h1 class="page-header" th:text="'Inventario ' + ' ' +   ${session.usuario.getSede_idsede().nombre}">
                Inventario
            </h1>
        </div>

        <!-- /. COMUNIDAD  -->
        <div id="page-inner">

            <form method="get" th:action="@{'/inventarioSede/buscadorMiSede'}">

                <input th:if="${busqueda!=null}" th:value="${busqueda}" name="searchField"
                       class="form-control mb-3" type="text" placeholder="Buscar"
                       aria-label="Search" style="width: 40%">
                <input th:if="${busqueda==null}" name="searchField" class="form-control mb-3" type="text"
                       placeholder="Buscar"
                       aria-label="Search" style="width: 40%">
                <div th:if="${msgBuscador != null}" th:text="${msgBuscador}" style="color: #ac2925"></div>

                <button type="submit" class="btn btn-outline-danger">buscar</button>
                <a th:href="@{'/inventarioSede/listarInvMiSede'}" class="btn btn-outline-danger">Limpiar</a>

            </form>

            <div class="row">
                <div class="col-md-12">
                    <div class="card">

                        <div class="card-content">

                            <div class="table-responsive">
                                <div th:if="${msgPagina != null}" th:text="${msgPagina}" class="alert alert-success"
                                     role="alert"></div>

                                <table class="table table-striped table-bordered table-hover" >
                                    <thead>

                                    <tr class="info">

                                        <th>Nombre Producto</th>
                                        <th>Descripcion Del Producto</th>
                                        <th>Stock</th>
                                        <th>Fecha de llegada</th>


                                    </tr>
                                    </thead>
                                    <tbody >
                                    <tr th:each="inv : ${listaInventarioSede}" th:if="${inv.estado == 'recibido'}">
                                        <td th:text="${inv.getInventarioproductoidinventario().getProducto().nombreproducto}"></td>
                                        <td th:text="${inv.getInventarioproductoidinventario().getProducto().getDescripcionproducto()}"></td>
                                        <td th:text="${inv.stock}">de31edae</td>
                                        <td th:text="${inv.getFechallegada()}">---</td>

                                    </tr>

                                    </tbody>

                                </table>

                                </form>

                                <div class="row">
                                    <div class="col-md-4"></div>
                                    <div class="col-md-8">

                                        <ul th:if="${last != 1}" class="pagination justify-content-center">
                                            <li class ="page-item" th:if="${current != 1 }">
                                                <a class="page-link"  th:if="${busqueda }" th:href="@{'/inventarioSede/buscadorMiSede' + '?page=' + ${prev} + '&' + 'searchField='+ ${busqueda}} "> Anterior </a>
                                                <a class="page-link" th:unless="${busqueda}" th:href="@{'/inventarioSede/listarInvMiSede' + '?page=' + ${prev}} "> Anterior </a>
                                            </li>

                                            <li class ="page-item" th:each="page:${pages}" th:classappend="${current == page ? 'active' : ''}" >
                                                <a class="page-link" th:if="${busqueda}" th:href="@{'/inventarioSede/buscadorMiSede' + '?searchField='+ ${busqueda} + '&' + 'page=' + ${page}} " th:text="${page}"  ></a>
                                                <a class="page-link" th:unless="${busqueda}" th:href="@{'/inventarioSede/listarInvMiSede' + '?page=' + ${page}} " th:text="${page}"  ></a>
                                            </li>

                                            <li class ="page-item" th:if="${current != last }">
                                                <a class="page-link"  th:if="${busqueda}" th:href="@{'/inventarioSede/buscadorMiSede' + '?page=' + ${next} + '&' + 'searchField='+ ${busqueda}} "> Siguiente </a>
                                                <a class="page-link" th:unless="${busqueda}" th:href="@{'/inventarioSede/listarInvMiSede' + '?page=' + ${next}} "> Siguiente </a>
                                            </li>

                                        </ul>


                                    </div>
                                </div>


                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>


<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>

</body>

</html>
