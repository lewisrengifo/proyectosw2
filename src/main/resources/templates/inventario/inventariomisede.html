<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/leftbar.html :: cabecera(titulo = 'Inventario sede')">


</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->
    <div id="page-wrapper">
        <div class="header">
            <h1 class="page-header">
                INVENTARIO SEDE
            </h1>
        </div>

        <!-- /. COMUNIDAD  -->
        <div id="page-inner">

            <div class="row">
                <div class="col-md-12">
                    <div class="card">

                        <div class="card-content">

                            <div class="table-responsive">

                                <div th:if="${msgPagina != null}" th:text="${msgPagina}" class="alert alert-warning"
                                     role="alert"></div>



                                <br>

                                <table class="table table-striped table-bordered table-hover" >
                                    <thead>

                                    <tr class="info">

                                        <th>Nombre Producto</th>
                                        <th>Descripcion Del Producto</th>
                                        <th>Codigo Generado</th>
                                        <th>Stock</th>
                                        <th>Fecha de llegada</th>
                                        <th></th>


                                    </tr>
                                    </thead>
                                    <tbody >
                                    <tr th:each="inv : ${listaInventarioSede}" th:if="${inv.estado == 'recibido'}">
                                        <td th:text="${inv.getInventarioproductoidinventario().getProducto().nombreproducto}"></td>
                                        <td th:text="${inv.getInventarioproductoidinventario().getProducto().getDescripcionproducto()}"></td>
                                        <td th:text="${inv.getInventarioproductoidinventario().getCodigogenerado()}"> </td>
                                        <td th:text="${inv.stock}">de31edae</td>
                                        <td th:text="${inv.getFechallegada()}">---</td>
                                        <td><a th:if="${inv.getInventarioproductoidinventario().getConsignacionyventa().getTipo() == 'consignacion'}"
                                               th:href="@{'/inventarioSede/devolverPrincipal?id=' + ${inv.getIdiventariosede()} }">gaaaa</a></td>

                                    </tr>

                                    </tbody>

                                </table>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>


<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>

</body>

</html>
