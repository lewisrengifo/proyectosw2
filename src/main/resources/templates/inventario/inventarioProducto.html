<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='Moscoy')">
</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->
    <div id="page-wrapper">
        <div class="header">
            <h1 class="page-header">
                INVENTARIO PRINCIPAL
            </h1>
        </div>

        <!-- /. COMUNIDAD  -->
        <div id="page-inner">

            <div class="row">
                <div class="col-md-12">
                    <div class="card">

                        <div class="card-content">

                            <div class="table-responsive">

                                <h2>Ingresar pedido a inventario</h2>
                                <br><br>

                                <table class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr class="info">
                                        <th># pedido</th>
                                        <th>tipo</th>
                                        <th>fecha inicio</th>
                                        <th>fecha fin</th>
                                        <th>comunidad / artesano</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <td th:text="${consigYventa1.numeropedido}"></td>
                                    <td th:text="${consigYventa1.tipo}"></td>
                                    <td th:text="${consigYventa1.fechainicio.getDate()}+'/' + ${consigYventa1.getFechainicio().getMonth()+1}+'/' + ${consigYventa1.getFechainicio().getYear()+1900}">de31edae</td>
                                    <td th:if="${consigYventa1.tipo.equals('consignacion')}" th:text="${consigYventa1.fechafin.getDate()} +'/'+ ${consigYventa1.getFechafin().getMonth()+1}+'/' + ${consigYventa1.getFechafin().getYear()+1900}">---</td>
                                    <td th:unless="${consigYventa1.tipo.equals('consignacion')}">----</td>
                                    <td th:if="${consigYventa1.tipo}=='consignacion'" th:text=" ${consigYventa1.artesano.comunidad.nombrecomunidad} + ' / '+${consigYventa1.artesano.nombreartesano} + ' ' + ${consigYventa1.artesano.apellidopaterno} + ' '+${consigYventa1.artesano.apellidomaterno} "></td>
                                    <td th:unless="${consigYventa1.tipo}=='consignacion'" th:text="${consigYventa1.artesano.comunidad.nombrecomunidad}"></td>

                                    </tbody>

                                </table>
                                <br>
                                <!-- FORMULARIO DE AGREGAR PRODUCTOS-->
                                <form method="post" th:action="@{'/inventarioPrincipal/agregarProducto'}"
                                      th:object="${inventarioProducto}">
                                    <input type="hidden" th:field="*{idinventario}"/>
                                    <br>
                                    <!-- ELEGIR UN PRODUCTO -->
                                    <div class="form-group">
                                        <label for="producto">Producto</label>
                                        <select class="form-control" name="producto" id="producto" style="width: 40%">
                                            <option th:each=" pro : ${listaproducto}"
                                                    th:value="${pro.idproducto}"
                                                    th:text="${pro.nombreproducto} + '/ '+ ${pro.linea.getNombrelinea()}">
                                            </option>
                                        </select>
                                    </div>

                                    <!- FIN -->

                                    <!-- ELEGIR UN CATEGORIA -->
                                    <div>
                                        <label for="Categoria">Categoria</label>
                                        <select class="form-control" name="categoria" id="categoria" style="width: 40%">
                                            <option th:each=" ca : ${listacategoria}" th:value="${ca.idcategoria}"
                                                    th:text="${ca.nombrecategoria}">
                                            </option>
                                        </select>
                                    </div>
                                    <!-- FIN -->

                                    <!-- ELEGIR UN TAMAÑO -->
                                    <div class="form-group">
                                        <label for="Tamano">Tamaño</label>
                                        <select class="form-control" name="tamano" id="tamano" style="width: 40%">
                                            <option th:each=" ta : ${listatamano}" th:value="${ta.idtamano}"
                                                    th:text="${ta.nombretamano}">
                                            </option>
                                        </select>
                                    </div>
                                    <!-- FIN -->

                                    <div class="form-group">
                                        <label>Cantidad</label>
                                        <input type="text" class="form-control" th:field="*{cantidad}"
                                               style="width: 25%">
                                        <div class="text-danger" th:if="${#fields.hasErrors('cantidad')}"
                                             th:errors="*{cantidad}"></div>
                                    </div>
                                    <div class="form-group">
                                        <label>Color</label>
                                        <input type="text" class="form-control" th:field="*{color}" style="width: 25%">
                                        <div class="text-danger" th:if="${#fields.hasErrors('color')}"
                                             th:errors="*{color}"></div>
                                    </div>
                                    <div class="form-group">
                                        <label>Costo Moscoy</label>
                                        <input type="text" class="form-control" th:field="*{preciomosqoy}"
                                               style="width: 25%">
                                        <div class="text-danger" th:if="${#fields.hasErrors('preciomosqoy')}"
                                             th:errors="*{preciomosqoy}"></div>

                                    </div>
                                    <div class="form-group">
                                        <label>Costo Tejedor</label>
                                        <input type="text" class="form-control" th:field="*{preciotejedor}"
                                               style="width: 25%">
                                        <div class="text-danger" th:if="${#fields.hasErrors('preciotejedor')}"
                                             th:errors="*{preciotejedor}"></div>
                                    </div>

                                    <div class="form-group">
                                        <label>Facilitador</label>
                                        <input type="text" class="form-control" th:field="*{facilitador}"
                                               style="width: 25%">
                                        <div class="text-danger" th:if="${#fields.hasErrors('facilitador')}"
                                             th:errors="*{facilitador}"></div>
                                    </div>

                                        <input type="hidden" class="form-control" name="idconsignacionVenta" th:value="${consigYventa1.getIdconsignacion()}" >

                                    <!--div class="form-group">
                                        <label >Fecha Inicio</label>
                                        <input type="text" class="form-control" th:field="*{fechainicio}" style="width: 25%">
                                        <div class="text-danger" th:if="${#fields.hasErrors('fechainicio')}" th:errors="*{fechainicio}"></div>
                                    </div-->


                                    <a th:href="@{'/inventarioPrincipal'}"  class="btn btn-danger">Cancelar</a>
                                    <button type="submit"  class="btn btn-outline-danger">+ producto</button>
                                    <a th:href="@{'/inventarioPrincipal'}"  class="btn btn-outline-danger">Finalizar
                                        Pedido</a>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>


<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>

</body>

</html>
