<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='Lista de Categorías')">
</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>

    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>


    <!-- /. NAV SIDE  -->
    <div id="page-wrapper">
        <div class="header">
            <h1 class="page-header">
                Categorías
            </h1>
        </div>
        <!-- /. CATEGORIA  -->
        <div id="page-inner">
            <!-- /. CATEGORIA  -->
            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-action">
                            <a class="btn btn-primary right" th:href="@{'/categoria/nuevo'}">agregar</a>
                        </div>
                        <div class="card-content">
                            <div class="table-responsive">
                                <div th:if="${msg != null}" th:text="${msg}" class="alert alert-success"
                                     role="alert"></div>

                                <table class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr class="info">
                                        <th>#</th>
                                        <th>NOMBRE</th>
                                        <th>CODIGO</th>
                                        <th sec:authorize="hasAnyAuthority('Gestor principal')"></th>
                                        <th sec:authorize="hasAnyAuthority('Gestor principal')"></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="c, info : ${listacategoria}">
                                        <td th:text="${info.index +1}">1</td>
                                        <td th:text="${c.nombrecategoria}">Home</td>
                                        <td th:text="${c.codigocategoria}">H</td>
                                        <td sec:authorize="hasAnyAuthority('Gestor principal')" ><a th:href="@{'categoria/editar?id=' + ${c.idcategoria}}"> editar</a></td>
                                        <td sec:authorize="hasAnyAuthority('Gestor principal')" ><a th:href="@{'categoria/borrar?id=' + ${c.idcategoria}}">borrar</a></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <!-- End  Kitchen Sink -->
                </div>
            </div>
        </div>
    </div>
</div>
<!-- /. PAGE WRAPPER  -->
<!-- /. WRAPPER  -->
<!-- JS Scripts-->

<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>

</body>

</html>
