<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='Lista de Comunidades')">
</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>
    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>

    <div id="page-wrapper">
        <div class="header">
            <h1 class="page-header2">
                Comunidades
            </h1>
            <form class="page-header2" style="width: 400px" method="post" th:action="@{'/comunidad/buscar'}">
                <input th:if="${busqueda!=null}" th:value="${busqueda}" type="text" class="form-control" placeholder="Texto a buscar" name="nom">
                <input th:if="${busqueda==null}" th:value="${busqueda}" type="text" class="form-control" placeholder="Texto a buscar" name="nom">
                <div th:if="${msgBuscador != null}" th:text="${msgBuscador}" style="color: #ac2925"></div>
                <br th:if="${msgBuscador != null}">
                <button class="btn btn-info " type="submit">Buscar</button>
                <a th:href="@{'/comunidad'}" class="btn btn-info">Limpiar</a>
            </form>
        </div>
        <!-- /. Tabla de Comunidad  -->
        <div class="col-md-8 padding">
            <div class="card">
                <div th:if="${!listaComunidad.isEmpty()}" class="card-action"
                     sec:authorize="hasAnyAuthority('Gestor principal')">
                    <a class="btn btn-outline-danger" th:href="@{'/comunidad/nuevo'}">Agregar</a>
                </div>
                <div class="card-content">
                    <div class="table-responsive">
                        <div th:if="${msgCo != null}" th:text="${msgCo}" class="alert alert-success"
                             role="alert"></div>
                        <div th:if="${msgE != null}" th:text="${msgE}" class="alert alert-warning"
                             role="alert"></div>
                        <div th:if="${listaComunidad.isEmpty()}" class="alert alert-info"
                             role="alert">No se encuentra Comunidades
                        </div>
                        <table th:if="${!listaComunidad.isEmpty()}"
                               class="table table-striped table-bordered table-hover">
                            <thead>
                            <tr class="info">
                                <th class="center-align">#</th>
                                <th class="center-align">NOMBRE</th>
                                <th class="center-align">CÓDIGO</th>
                                <th sec:authorize="hasAnyAuthority('Gestor principal')"></th>
                                <th sec:authorize="hasAnyAuthority('Gestor principal')"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="c, info : ${listaComunidad}">
                                <td class="center-align" th:text="${info.index +1 + prev*5}">1</td>
                                <td class="center-align" th:text="${c.nombrecomunidad}">Home</td>
                                <td class="center-align" th:text="${c.codigocomunidad}">H</td>
                                <td sec:authorize="hasAnyAuthority('Gestor principal')" class="center-align"><a
                                        th:href="@{'comunidad/editar?id=' + ${c.idcomunidad}}"> Editar</a></td>
                                <td sec:authorize="hasAnyAuthority('Gestor principal')" class="center-align"><a
                                        th:href="@{'comunidad/borrar?id=' + ${c.idcomunidad}}">Borrar</a></td>
                            </tr>
                            </tbody>
                        </table>
                        <br>
                        <div class="row">
                            <div class="col-md-4"></div>
                            <div class="col-md-8">
                                <ul th:if="${last != 1}" class="pagination justify-content-center">
                                    <li class="page-item" th:if="${current != 1 }">
                                        <a class="page-link" th:if="${busqueda }"
                                           th:href="@{'/comunidad/search' + '?page=' + ${prev} + '&' + 'search='+ ${busqueda}} ">
                                            Anterior </a>
                                        <a class="page-link" th:unless="${busqueda}"
                                           th:href="@{'/comunidad' + '?page=' + ${prev}} "> Anterior </a>
                                    </li>

                                    <li class="page-item" th:each="page:${pages}"
                                        th:classappend="${current == page ? 'active' : ''}">
                                        <a class="page-link" th:if="${busqueda}"
                                           th:href="@{'/comunidad/search' + '?search='+ ${busqueda} + '&' + 'page=' + ${page}} "
                                           th:text="${page}"></a>
                                        <a class="page-link" th:unless="${busqueda}"
                                           th:href="@{'/comunidad' + '?page=' + ${page}} " th:text="${page}"></a>
                                    </li>

                                    <li class="page-item" th:if="${current != last }">
                                        <a class="page-link" th:if="${busqueda}"
                                           th:href="@{'/comunidad/search' + '?page=' + ${next} + '&' + 'search='+ ${busqueda}} ">
                                            Siguiente </a>
                                        <a class="page-link" th:unless="${busqueda}"
                                           th:href="@{'/comunidad' + '?page=' + ${next}} "> Siguiente </a>
                                    </li>

                                </ul>

                            </div>
                        </div>
                        <!--nav>
                            <ul class="pagination">
                                <li class="page-item" th:each="item:${page.paginas}" th:class="${item.actual?'page-item active':'page-item'}">
                                    <span class="page-link" th:if="${item.actual}" th:text="${item.numero}"></span>
                                    <a class="page-link" th:if="${not item.actual}" th:href="@{${page.url}(page=${item.numero-1})}" th:text="${item.numero}"></a>

                                </li>
                            </ul>
                        </nav-->

                    </div>

                </div>

            </div>
            <!-- End  Kitchen Sink -->
        </div>

    </div>
</div>
<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>
</body>
</html>
