<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/leftbar.html :: cabecera(titulo='Lista de Comunidades')">
</head>
<body>
<div id="wrapper">
    <nav th:replace="fragments/leftbar.html :: barrasuperior"></nav>
    <nav th:replace="fragments/leftbar.html :: barraizquierda"></nav>

    <div id="page-wrapper">
        <div class="header">
            <h1 class="page-header2">
                Lista de Comunidades
            </h1>
            <form class="page-header2" style="width: 400px" method="post" th:action="@{'/comunidad/buscar'}" >
                    <input type="text" class="form-control" placeholder="Texto a buscar" name="nom">
                    <button  class="btn btn-info " type="submit">Buscar</button>
                    <a th:href="@{'/comunidad'}" class="btn btn-primary">Volver</a>
            </form>
        </div>
        <!-- /. Tabla de Comunidad  -->
                    <div class="col-md-8 padding">
                        <div class="card">
                            <div th:if="${!listaComunidad.isEmpty()}"  class="card-action">
                                <a class="btn btn-primary right" th:href="@{'/comunidad/nuevo'}">Agregar</a>
                            </div>
                            <div class="card-content">
                                <div class="table-responsive">
                                    <div th:if="${msgCo != null}" th:text="${msgCo}" class="alert alert-success"
                                         role="alert"></div>
                                    <div th:if="${listaComunidad.isEmpty()}"  class="alert alert-info"
                                         role="alert">No se encuentra Comunidades </div>
                                    <table th:if="${!listaComunidad.isEmpty()}" class="table table-striped table-bordered table-hover">
                                        <thead>
                                        <tr class="info">
                                            <th class="center-align"  >#</th>
                                            <th class="center-align" >NOMBRE</th>
                                            <th class="center-align" >CÓDIGO</th>
                                            <th></th>
                                            <th></th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="c, info : ${listaComunidad}">
                                            <td class="center-align" th:text="${info.index +1}">1</td>
                                            <td class="center-align" th:text="${c.nombrecomunidad}">Home</td>
                                            <td class="center-align" th:text="${c.codigocomunidad}">H</td>
                                            <td class="center-align"><a th:href="@{'comunidad/editar?id=' + ${c.idcomunidad}}"> Editar</a></td>
                                            <td class="center-align"><a th:href="@{'comunidad/borrar?id=' + ${c.idcomunidad}}">Borrar</a></td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                        <!-- End  Kitchen Sink -->
                    </div>
    </div>
</div>
<div th:replace="fragments/leftbar.html :: scriptsAbajo"></div>
</body>
</html>
